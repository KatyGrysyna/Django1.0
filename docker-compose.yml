services:
  db:
    image: postgres:16-alpine
    container_name: bookshop_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: bookshop_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: bookshop_web
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  nginx:
    image: nginx:stable-alpine
    container_name: bookshop_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx-bookshop.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web


  celery:
    build: .
    container_name: bookshop_celery
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["python", "-m", "celery"]
    command: ["-A", "shop_project", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    container_name: bookshop_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["python", "-m", "celery"]
    command: ["-A", "shop_project", "beat", "--loglevel=INFO", "--schedule=/var/lib/celery/beat-schedule"]
    volumes:
      - .:/app
      - celery_beat_data:/var/lib/celery
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  celery_beat_data: