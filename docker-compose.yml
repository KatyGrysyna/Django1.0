services:
  db:
    image: postgres:16-alpine
    container_name: bookshop_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: bookshop_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: bookshop_web
    restart: always
    env_file:
      - .env
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  warehouse:
    build: ./project_b
    container_name: warehouse_web
    restart: unless-stopped
    env_file:
      - ./project_b/.env
    volumes:
      - ./project_b:/app
      - warehouse_static_volume:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      warehouse-db:
        condition: service_healthy
      warehouse-redis:
        condition: service_healthy

  warehouse-redis:
    image: redis:7-alpine
    container_name: warehouse_redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - warehouse_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  warehouse-db:
    image: postgres:16-alpine
    container_name: warehouse_db
    restart: unless-stopped
    env_file:
      - ./project_b/.env
    volumes:
      - warehouse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  warehouse-celery:
    build: ./project_b
    container_name: warehouse_celery
    restart: unless-stopped
    env_file:
      - ./project_b/.env
    command:
      - "python"
      - "-m"
      - "celery"
      - "-A"
      - "warehouse_project"
      - "worker"
      - "--loglevel=INFO"
      - "--concurrency=1"
      - "--hostname=warehouse@%h"
    volumes:
      - ./project_b:/app
    depends_on:
      warehouse-db:
        condition: service_healthy
      warehouse-redis:
        condition: service_healthy

  warehouse-celery-beat:
    build: ./project_b
    container_name: warehouse_celery_beat
    restart: unless-stopped
    env_file:
      - ./project_b/.env
    command:
      - "python"
      - "-m"
      - "celery"
      - "-A"
      - "warehouse_project"
      - "beat"
      - "--loglevel=INFO"
      - "--schedule=/var/lib/celery/beat-schedule"
      - "--pidfile="
    volumes:
      - ./project_b:/app
      - warehouse_celery_beat_data:/var/lib/celery
    depends_on:
      warehouse-db:
        condition: service_healthy
      warehouse-redis:
        condition: service_healthy


  warehouse-nginx:
    image: nginx:stable-alpine
    container_name: warehouse_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:80"
    volumes:
      - ./project_b/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - warehouse_static_volume:/app/staticfiles:ro
    depends_on:
      - warehouse


  nginx:
    image: nginx:stable-alpine
    container_name: bookshop_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx-bookshop.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web


  celery:
    build: .
    container_name: bookshop_celery
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["python", "-m", "celery"]
    command: ["-A", "shop_project", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    container_name: bookshop_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["python", "-m", "celery"]
    command: ["-A", "shop_project", "beat", "--loglevel=INFO", "--schedule=/var/lib/celery/beat-schedule"]
    volumes:
      - .:/app
      - celery_beat_data:/var/lib/celery
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  celery_beat_data:
  warehouse_postgres_data:
  warehouse_static_volume:
  warehouse_redis_data:
  warehouse_celery_beat_data: