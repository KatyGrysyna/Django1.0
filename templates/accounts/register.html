{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Реєстрація" %}{% endblock %}

{% block content %}
<h1 class="mb-4">{% trans "Реєстрація" %}</h1>

<form method="post" style="max-width: 400px;">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        {% trans "Зареєструватися" %}
    </button>
</form>

<p class="mt-3">
    {% trans "Вже є акаунт?" %}
    <a href="{% url 'accounts:login' %}">
        {% trans "Увійти" %}
    </a>
</p>
{% endblock %}
