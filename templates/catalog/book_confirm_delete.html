{% extends 'base.html' %}

{% block title %}Видалити книгу{% endblock %}

{% block content %}
<h1 class="mb-4">Видалити книгу?</h1>

<p>Ви впевнені, що хочете видалити «{{ object.title }}»?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Так, видалити</button>
    <a href="{% url 'catalog:book_list' %}" class="btn btn-secondary">Скасувати</a>
</form>
{% endblock %}
