{% extends 'base.html' %}

{% block title %}
    {% if book %}Редагувати книгу{% else %}Додати книгу{% endif %}
{% endblock %}

{% block content %}
<h1 class="mb-4">
    {% if book %}Редагувати книгу{% else %}Додати книгу{% endif %}
</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Зберегти</button>
    <a href="{% url 'catalog:book_list' %}" class="btn btn-secondary">Скасувати</a>
</form>
{% endblock %}
