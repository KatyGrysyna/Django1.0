name: Django CI

on:
  push:
    branches:
      - main
      - ci-cd-deploy
      - microservices-warehouse
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.project }} - lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: ProjectA
            directory: .
            settings: shop_project.settings_test
          - project: ProjectB
            directory: project_b
            settings: warehouse_project.settings_test

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: django_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d django_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: ${{ matrix.settings }}
      SECRET_KEY: ci-only-key-for-automated-tests-0000000000000000000000000000
      DEBUG: "False"
      DB_NAME: django_ci
      DB_USER: ci_user
      DB_PASSWORD: ci_password
      POSTGRES_DB: django_ci
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      WAREHOUSE_ENABLED: "False"
      SENTRY_DSN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements.txt

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check formatting with Black
        run: python -m black --check .

      - name: Lint with flake8
        run: python -m flake8 .

      - name: Compile translations
        run: >-
          python manage.py compilemessages
          --ignore=staticfiles
          --ignore=project_b

      - name: Check Django configuration
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Check Redis connection
        run: >-
          python -c "import redis;
          connection = redis.Redis(host='127.0.0.1', port=6379);
          assert connection.ping();
          print('Redis connection: OK')"

      - name: Run tests with coverage
        run: >-
          python -m pytest
          --cov
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html
          --cov-fail-under=70

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.project }}
          path: |
            ${{ matrix.directory }}/coverage.xml
            ${{ matrix.directory }}/htmlcov/
          retention-days: 7

  docker:
    name: Docker - ${{ matrix.image }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bookshop
            context: .
          - image: warehouse
            context: ./project_b

    env:
      IMAGE_NAME: ${{ matrix.image }}
      CONTEXT_DIR: ${{ matrix.context }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag "${IMAGE_NAME}:ci" "$CONTEXT_DIR"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          BRANCH_TAG: ${{ github.ref_name }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          docker tag "${IMAGE_NAME}:ci" "${IMAGE}:${IMAGE_TAG}"
          docker tag "${IMAGE_NAME}:ci" "${IMAGE}:${BRANCH_TAG}"
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:${BRANCH_TAG}"
  deploy:
    name: Deploy - ${{ matrix.image }}
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/microservices-warehouse'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: bookshop
            hook_secret: RENDER_BOOKSHOP_DEPLOY_HOOK
          - image: warehouse
            hook_secret: RENDER_WAREHOUSE_DEPLOY_HOOK

    env:
      DEPLOY_HOOK: ${{ secrets[matrix.hook_secret] }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      IMAGE_NAME: ${{ matrix.image }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Trigger Render deployment
        shell: bash
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Render deploy hook secret is missing."
            exit 1
          fi

          IMAGE_URL="docker.io/${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}"

          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --get \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "$DEPLOY_HOOK"