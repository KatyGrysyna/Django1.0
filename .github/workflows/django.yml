name: Django CI

on:
  push:
    branches:
      - main
      - ci-cd-deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookshop_ci
          POSTGRES_USER: bookshop
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookshop -d bookshop_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: shop_project.settings_test
      SECRET_KEY: ci-only-key-for-automated-tests-0000000000000000000000000000
      DEBUG: "False"
      DB_NAME: bookshop_ci
      DB_USER: bookshop
      DB_PASSWORD: ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      SENTRY_DSN: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Check formatting with Black
        run: python -m black --check .

      - name: Lint with flake8
        run: python -m flake8 .

      - name: Run tests with coverage
        run: >-
          python -m pytest
          --cov
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html
          --cov-fail-under=70

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  docker:
    name: Build and publish Docker image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build --tag bookshop:ci .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          BRANCH_TAG: ${{ github.ref_name }}
        run: |
          docker tag bookshop:ci "${DOCKERHUB_USERNAME}/bookshop:${IMAGE_TAG}"
          docker tag bookshop:ci "${DOCKERHUB_USERNAME}/bookshop:${BRANCH_TAG}"
          docker push "${DOCKERHUB_USERNAME}/bookshop:${IMAGE_TAG}"
          docker push "${DOCKERHUB_USERNAME}/bookshop:${BRANCH_TAG}"